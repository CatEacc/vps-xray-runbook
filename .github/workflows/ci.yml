name: Shell Syntax & Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          bash -n setup.sh
          echo "setup.sh syntax OK"

      - name: ShellCheck error-level audit
        run: |
          shellcheck -S error setup.sh
          echo "ShellCheck error-level audit OK"

      - name: Verify embedded Python blocks compile
        run: |
          python3 - << 'PY'
          import re, ast
          src = open("setup.sh", encoding="utf-8").read()
          blocks = re.findall(r"python3\s+-\s*<<\s*'([A-Z0-9_]+)'\n(.*?)\n\1\b", src, re.S)
          print(f"Found {len(blocks)} embedded Python blocks")
          for idx, (tag, code) in enumerate(blocks, 1):
              ast.parse(code)
              print(f"  Block #{idx} ({tag}): syntax OK")
          PY
