  <rect x="36" y="246" width="1128" height="34" rx="8" fill="#060911" stroke="#1e293b" stroke-width="1"/>
  <text x="54" y="267.5" fill="#06b6d4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">$ bash &lt;(curl -fsSL https://raw.githubusercontent.com/CatEacc/vps-xray-runbook/main/setup.sh)</text>
