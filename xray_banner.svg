<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="vps-xray-runbook">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="90%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Top bar -->
  <circle cx="34" cy="28" r="5.5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="54" cy="28" r="5.5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="74" cy="28" r="5.5" fill="#22c55e" fill-opacity="0.85"/>
  <text x="100" y="32.5" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.6">CatEacc / OPEN-SOURCE RUNBOOK</text>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#1e293b" stroke-width="1"/>

  <!-- Accent left bar -->
  <rect x="36" y="76" width="5" height="92" rx="2.5" fill="url(#accent)"/>

