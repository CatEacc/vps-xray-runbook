  <text x="56" y="124" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-0.8">vps-xray-runbook</text>
  <text x="56" y="162" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19.5" font-weight="400">Production Xray-core & 3x-ui Deployment Suite · Pure JSON & Alpine OpenRC</text>

  <!-- Feature Pills -->
  <g transform="translate(56, 196)"><rect x="0" y="0" width="248" height="30" rx="15" fill="#131c2e" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1"/><text x="124.0" y="19.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="500">Xray v26.11.9 & 3x-ui v3.11.0</text></g><g transform="translate(316, 196)"><rect x="0" y="0" width="263" height="30" rx="15" fill="#131c2e" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1"/><text x="131.5" y="19.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="500">Multi-Client 1-50 & SOCKS5/HTTP</text></g><g transform="translate(591, 196)"><rect x="0" y="0" width="263" height="30" rx="15" fill="#131c2e" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1"/><text x="131.5" y="19.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="500">9-Region SNI Audit & Anti-Steal</text></g><g transform="translate(866, 196)"><rect x="0" y="0" width="225" height="30" rx="15" fill="#131c2e" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1"/><text x="112.5" y="19.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="500">Hy2 pinSHA256 & Clash YAML</text></g>

